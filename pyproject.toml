[project]
name = "dso"
version = "0.1.0"
description = "Data Storage Optimization - Ericsson challenge, Campor x BUILD Hackathon 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2,<2",      # speech-to-text (MIT); decodes audio itself via PyAV
    "av>=15,<16",                  # PyAV 16+ breaks faster-whisper 1.2 decode_audio (tested 2026-11-11)
    "pypdfium2>=4.30",             # PDF render + text (Apache-2.0/BSD; avoids PyMuPDF's AGPL)
    "opencv-python-headless>=4.10",# read video frames, ships its own ffmpeg (Apache-2.0)
    "imagehash>=4.3",              # dHash (BSD)
    "pillow>=10",                  # save WebP/JPEG
    "flask>=3",                    # local demo web UI
    "sherpa-onnx>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dso = "dso.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
